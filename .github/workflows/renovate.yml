name: Renovate (reusable)

# Reusable self-hosted Renovate runner. Pairs with default.json (the policy).
# Caller (scheduled + dispatch):
#   jobs:
#     renovate:
#       uses: MurineShiftWork/renovate-config/.github/workflows/renovate.yml@v1
#       secrets:
#         RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
on:
  workflow_call:
    secrets:
      RENOVATE_TOKEN:
        description: PAT with Contents + Pull requests + Workflows write on the calling repo. Its events trigger CI + versioning (GITHUB_TOKEN does not).
        required: true

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  LOG_LEVEL: debug
  RENOVATE_REPOSITORIES: ${{ github.repository }}

jobs:
  renovate:
    name: Renovate dependency scan
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: renovatebot/github-action@v46.1.17
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
