name: Renovate (reusable)

# Reusable self-hosted Renovate runner. Pairs with default.json (the policy).
# Caller (scheduled + dispatch):
#   jobs:
#     renovate:
#       uses: MurineShiftWork/renovate-config/.github/workflows/renovate.yml@v1
#       secrets:
#         CI_CLIENT_ID: ${{ secrets.MURINESHIFTWORK_CI_CLIENT_ID }}
#         CI_PRIVATE_KEY: ${{ secrets.MURINESHIFTWORK_CI_PRIVATE_KEY }}
on:
  workflow_call:
    secrets:
      CI_CLIENT_ID:
        description: Client ID of the CI GitHub App. Its PRs trigger CI + versioning (GITHUB_TOKEN's do not).
        required: true
      CI_PRIVATE_KEY:
        description: Private key of the CI GitHub App.
        required: true

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  LOG_LEVEL: debug
  RENOVATE_REPOSITORIES: ${{ github.repository }}

jobs:
  renovate:
    name: Renovate dependency scan
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.CI_CLIENT_ID }}
          private-key: ${{ secrets.CI_PRIVATE_KEY }}
      - uses: renovatebot/github-action@v46.1.17
        with:
          configurationFile: renovate.json
          token: ${{ steps.app-token.outputs.token }}
